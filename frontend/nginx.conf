server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip básica
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache agressivo para assets com hash no nome (JS/CSS gerados pelo Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback: qualquer rota que não seja um arquivo real cai no index.html
    # (necessário para React Router funcionar em refresh/deep links)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
