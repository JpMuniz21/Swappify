ServerName localhost

# Cada processo do Apache mantém 1 conexão persistente com o banco (DB_PERSISTENT=true).
# Limitar os processos mantém o número de conexões abaixo do limite do pooler do Supabase.
<IfModule mpm_prefork_module>
    StartServers             3
    MinSpareServers          2
    MaxSpareServers          5
    MaxRequestWorkers        10
    MaxConnectionsPerChild   0
</IfModule>
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Arquivos do build do React têm hash no nome: podem ficar em cache por 1 ano.
    <Directory /var/www/html/public/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    # A página do React sempre é buscada de novo, para pegar a versão nova após um deploy.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
